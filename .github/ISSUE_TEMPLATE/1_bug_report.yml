name: Bug report
description: Something in Thorough Chests doesn't work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If the game crashed, use **Crash report** instead.
        If an augment does the wrong thing, use **Augment problem**.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see.
      placeholder: The search bar shows no items even though the chest holds some.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Place a Gold Chest and put 20 iron ingots in it
        2. Open the chest and type iron in the search bar
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Thorough Chests version
      description: From the jar's file name or the mod list.
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft and loader versions
      placeholder: Minecraft 26.2, NeoForge ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where is Thorough Chests installed?
      options:
        - Single player
        - Dedicated server
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The mods in your instance, or a link to your modpack. Leave empty if it happens with Thorough Chests alone.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag images or a short clip in here.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        `logs/latest.log` from your Minecraft folder. For a long log, upload it to https://mclo.gs or a GitHub gist and paste the link.
      render: text
